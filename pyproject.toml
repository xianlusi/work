[project]
name = "image-tool"
version = "0.1.0"
description = "一个用于读取图片信息并完成常用编辑操作的小型命令行工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
]

[project.scripts]
imagetool = "imagetool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagetool"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
